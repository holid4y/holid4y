<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img" aria-label="VPKAsync (rust): packs a folder into source engine vpk files, same output as valve&#x27;s vpk.exe, splitting into chunks past 600 mb. about 4x faster than vpk.exe"><title>VPKAsync (rust): packs a folder into source engine vpk files, same output as valve&#x27;s vpk.exe, splitting into chunks past 600 mb. about 4x faster than vpk.exe</title><style>@font-face{font-family:'DR';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'DB';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre;font-variant-ligatures:none;font-family:'DR','DejaVu Sans Mono',Menlo,Consolas,monospace}.b{font-family:'DB','DejaVu Sans Mono',Menlo,Consolas,monospace;font-weight:700}.cur{animation:blink 1.1s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}@keyframes show{from{opacity:0}}@keyframes type{from{transform:translateX(var(--w))}to{transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="820" height="250" fill="#0d1117"/><line x1="24.00" y1="10.00" x2="796.00" y2="10.00" stroke="#3a3f45" stroke-width="2" stroke-dasharray="8 10"/><line x1="24.00" y1="240.00" x2="796.00" y2="240.00" stroke="#3a3f45" stroke-width="2" stroke-dasharray="8 10"/><line x1="10.00" y1="24.00" x2="10.00" y2="226.00" stroke="#3a3f45" stroke-width="2" stroke-dasharray="8 10"/><line x1="810.00" y1="24.00" x2="810.00" y2="226.00" stroke="#3a3f45" stroke-width="2" stroke-dasharray="8 10"/><text x="3.00" y="18.00" font-size="24" fill="#7d8590" xml:space="preserve">+</text><text x="803.00" y="18.00" font-size="24" fill="#7d8590" xml:space="preserve">+</text><text x="3.00" y="248.00" font-size="24" fill="#7d8590" xml:space="preserve">+</text><text x="803.00" y="248.00" font-size="24" fill="#7d8590" xml:space="preserve">+</text><text x="36.00" y="66.00" font-size="30" fill="#7d8590" xml:space="preserve">&gt;</text><text x="72.12" y="66.00" font-size="30" fill="#e6edf3" class="b" xml:space="preserve">VPKAsync</text><text x="726.20" y="64.00" font-size="24" fill="#7d8590" xml:space="preserve">rust</text><text x="36.00" y="112.00" font-size="24" fill="#b0b6bc" xml:space="preserve">packs a folder into source engine vpk files, same</text><text x="36.00" y="146.00" font-size="24" fill="#b0b6bc" xml:space="preserve">output as valve&#x27;s vpk.exe, splitting into chunks</text><text x="36.00" y="180.00" font-size="24" fill="#b0b6bc" xml:space="preserve">past 600 mb.</text><text x="36.00" y="214.00" font-size="24" fill="#7d8590" xml:space="preserve"># about 4x faster than vpk.exe</text></svg>